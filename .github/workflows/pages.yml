name: Validate, deploy and verify MareVero

on:
  push:
    branches: [main]
    paths-ignore:
      - deployment-status.json
      - ci-diagnostics.json
      - pages-diagnostics.json
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check web manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Check required files
        run: test -s index.html && test -s styles.css && test -s app.js

  deploy:
    needs: validate
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Upload static site
        id: upload
        if: ${{ steps.configure.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: publish
        if: ${{ steps.upload.outcome == 'success' }}
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Record Pages step outcomes
        if: ${{ always() }}
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          node -e "require('fs').writeFileSync('pages-diagnostics.json',JSON.stringify({configure:process.env.CONFIGURE_OUTCOME,upload:process.env.UPLOAD_OUTCOME,publish:process.env.PUBLISH_OUTCOME,commit:process.env.GITHUB_SHA,recorded_at:new Date().toISOString()},null,2)+'\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-diagnostics.json
          git commit -m "Record Pages step diagnostics [skip ci]"
          git push
          test "$CONFIGURE_OUTCOME" = "success"
          test "$UPLOAD_OUTCOME" = "success"
          test "$PUBLISH_OUTCOME" = "success"

  verify:
    needs: deploy
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Verify public app
        run: curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors https://azzaroaleandro.github.io/meteo-app/ > /dev/null
      - name: Record successful deployment
        run: |
          node -e "require('fs').writeFileSync('deployment-status.json', JSON.stringify({status:'live',url:'https://azzaroaleandro.github.io/meteo-app/',verified_at:new Date().toISOString(),commit:process.env.GITHUB_SHA},null,2)+'\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-status.json
          git commit -m "Record successful Pages deployment [skip ci]"
          git push
