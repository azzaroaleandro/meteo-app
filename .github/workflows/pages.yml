name: Validate, deploy and verify MareVero

on:
  push:
    branches: [main]
    paths-ignore:
      - deployment-status.json
      - ci-diagnostics.json
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check web manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
      - name: Check required files
        run: test -s index.html && test -s styles.css && test -s app.js

  deploy:
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify public app
        run: curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors https://azzaroaleandro.github.io/meteo-app/ > /dev/null
      - name: Record successful deployment
        run: |
          node -e "require('fs').writeFileSync('deployment-status.json', JSON.stringify({status:'live',url:'https://azzaroaleandro.github.io/meteo-app/',verified_at:new Date().toISOString(),commit:process.env.GITHUB_SHA},null,2)+'\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-status.json
          git commit -m "Record successful Pages deployment [skip ci]"
          git push

  report-failure:
    needs: [validate, deploy]
    if: ${{ always() && (needs.validate.result != 'success' || needs.deploy.result != 'success') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      VALIDATE_RESULT: ${{ needs.validate.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build diagnostic report
        run: node -e "const fs=require('fs'),cp=require('child_process');const js=cp.spawnSync(process.execPath,['--check','app.js'],{encoding:'utf8'});fs.writeFileSync('ci-diagnostics.json',JSON.stringify({status:'failed',validate:process.env.VALIDATE_RESULT,deploy:process.env.DEPLOY_RESULT,javascript:{exit_code:js.status,output:(js.stderr||js.stdout||'syntax ok').trim()},commit:process.env.GITHUB_SHA,recorded_at:new Date().toISOString()},null,2)+'\n')"
      - name: Publish diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-diagnostics.json
          git commit -m "Record cloud deployment diagnostics [skip ci]"
          git push
